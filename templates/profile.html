{% extends "base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 2rem auto; background: white; border: 1px solid var(--border); border-radius: 8px; padding: 2rem;">
    <h2 style="margin-bottom: 1.5rem;">User Profile</h2>
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" readonly value="{{ user.name }}" class="form-control" style="background: #f9fafb;">
    </div>
    <div class="form-group">
        <label>Email Address</label>
        <input type="text" readonly value="{{ user.email }}" class="form-control" style="background: #f9fafb;">
    </div>
    <div class="form-group">
        <label>Account Role</label>
        <input type="text" readonly value="{{ user.role|upper }}" class="form-control" style="background: #f9fafb;">
    </div>
    <div class="form-group">
        <label>Member Since</label>
        <input type="text" readonly value="{{ user.created_at.strftime('%Y-%m-%d') }}" class="form-control" style="background: #f9fafb;">
    </div>
</div>
{% endblock %}
