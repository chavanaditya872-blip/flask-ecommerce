{% extends "base.html" %}
{% block content %}
<div style="max-width: 420px; margin: 3rem auto; background: white; border: 1px solid var(--border); border-radius: 8px; padding: 2rem;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required class="form-control">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required class="form-control">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required class="form-control">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
    </form>
    <p style="text-align: center; font-size: 0.85rem; margin-top: 1rem;">
        Already registered? <a href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
{% endblock %}
